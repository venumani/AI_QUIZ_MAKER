version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quiz_postgres
    restart: always
    environment:
      POSTGRES_USER: quiz_user
      POSTGRES_PASSWORD: quiz_secure_password
      POSTGRES_DB: ai_quiz_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: quiz_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://quiz_user:quiz_secure_password@postgres:5432/ai_quiz_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-ai-quiz-maker-jwt-2026-secure}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: quiz_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
